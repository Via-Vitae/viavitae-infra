# Ansible configuration for viavitae-infra.
#
# Deliberate choices, each of which has a failure mode it prevents:
#
#   host_key_checking = True     A first connection to a rebuilt VM fails until its
#                                key is accepted. That is the point: an accepted
#                                host key is an assertion that the machine at that
#                                address is the machine that was there before, and
#                                silently accepting a new one is how a man-in-the
#                                middle survives a rebuild.
#   pipelining = True            Fewer SSH round trips per task. Requires
#                                `requiretty` to be off, which the hardening role
#                                ensures; if pipelining is on and sudo needs a tty,
#                                every task fails with a confusing message.
#   interpreter_python =
#     auto_silent                Discovers the guest's Python instead of assuming
#                                /usr/bin/python. The alternative is a warning per
#                                task that trains everyone to ignore warnings.
#   vars_plugins_enabled         Includes community.sops.sops, which is what makes
#                                `*.sops.yml` group_vars readable as plaintext. If
#                                this line is removed, encrypted variables resolve to
#                                ciphertext and are then written to the guest.
#   retry_files_enabled = False  A `.retry` file is a half-applied configuration on
#                                disk. Re-running against the failed hosts is a
#                                decision; leaving a file behind is litter that the
#                                next person assumes is current.

[defaults]
inventory               = inventories/dev/hosts.yml
roles_path              = roles
collections_path        = ~/.ansible/collections:/usr/share/ansible/collections
remote_user             = viavitae
forks                   = 10
timeout                 = 30
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = /tmp/ansible_facts_viavitae
fact_caching_timeout    = 900
host_key_checking       = True
retry_files_enabled     = False
stdout_callback         = ansible.builtin.default
result_format           = yaml
callbacks_enabled       = profile_tasks
deprecation_warnings    = True
display_skipped_hosts   = False
interpreter_python      = auto_silent
vars_plugins_enabled    = host_group_vars,community.sops.sops
nocolor                 = 0
# Written to a git-ignored path. A log of every task and every host is the record of
# what was actually done, which is what an auditor asks for and what memory does not
# retain at 02:00.
log_path                = ./ansible.log

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
pipelining     = True
ssh_args       = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o IdentitiesOnly=yes
control_path   = %(directory)s/%%h-%%r
# Retries are for connection establishment only. A task that fails half-way is not
# retried, because a partially applied task retried blindly is how a database ends up
# with two owners.
retries        = 3

[persistent_connection]
connect_timeout = 30
command_timeout = 60

[inventory]
# An inventory that cannot be parsed must stop the run, not be partially read.
unparsed_is_failed = True
enable_plugins     = yaml,ini
