# Inventory for the `dev` environment.
#
# `dev` is one disposable VM. It has no PostgreSQL host, no Keycloak host and no
# monitoring host: its database runs in-cluster as a StatefulSet (ADR-003 decision 8),
# its developers authenticate against staging's identity provider, and it ships metrics
# and logs to the shared monitoring object store. The empty groups below are not
# placeholders — a play that targets `postgres` and finds no hosts must skip cleanly
# rather than fail, and an undefined group is a typo that looks like an empty one.
#
# This file is hand-maintained and must agree with `terraform/envs/dev` outputs.
# `tools/preflight.sh` compares the two and fails on a mismatch, because an inventory
# that points at a rebuilt VM runs hardening against a machine that no longer exists
# and reports success.
#
# No credential of any kind belongs in this file. Secrets live in
# `group_vars/vault.sops.yml`, SOPS-encrypted with age, per ADR-005.

all:
  vars:
    ansible_user: viavitae
    ansible_ssh_common_args: "-o IdentitiesOnly=yes"
    environment_name: dev
    vlan_id: 50
    subnet: 10.10.50.0/24
    gateway: 10.10.50.1

  children:
    viavitae:
      hosts:
        dev-k3s-0:
          ansible_host: 10.10.50.10
          vmid: 1000
          k3s_role: control_plane
          node: pve-01

      children:
        k3s_control_plane:
          hosts:
            dev-k3s-0:
        k3s_worker:
          hosts:
            dev-k3s-0:
        k3s_cluster:
          children:
            k3s_control_plane:
            k3s_worker:
        postgres:
          hosts: {}
        keycloak:
          hosts: {}
        bitrix24:
          hosts: {}
        monitoring_store:
          hosts: {}
        backup_targets:
          children:
            k3s_cluster:
