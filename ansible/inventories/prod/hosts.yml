# Inventory for the `prod` environment.
#
# Production. Addresses and VMIDs match the allocation table in
# docs/network-topology.md and the committed budget in docs/capacity-plan.md; a
# disagreement between those documents and this file is a defect in one of them.
#
# `db-02` is absent because `postgres_standby_enabled` is false in the pilot. Adding it
# here without adding it in Terraform creates a host Ansible will try to configure and
# that does not exist, which fails on the first task rather than quietly doing nothing.
#
# The load balancers and runners appear under `mgmt` and, for the balancers, also under
# `dmz`: they are the only dual-homed hosts in the estate.
#
# This file is hand-maintained and must agree with `terraform/envs/prod` outputs.
# `tools/preflight.sh` compares the two and fails on a mismatch, because an inventory
# that points at a rebuilt VM runs hardening against a machine that no longer exists
# and reports success.
#
# No credential of any kind belongs in this file. Secrets live in
# `group_vars/vault.sops.yml`, SOPS-encrypted with age, per ADR-005.

all:
  vars:
    ansible_user: viavitae
    ansible_ssh_common_args: "-o IdentitiesOnly=yes"
    environment_name: prod
    vlan_id: 20
    subnet: 10.10.20.0/24
    gateway: 10.10.20.1

  children:
    # The hypervisors. Kept out of the `viavitae` group on purpose: hardening,
    # patching and the backup-check role treat a Proxmox host differently from a
    # guest, and a play that targets `viavitae` must not quietly include the machine
    # everything else runs on.
    proxmox:
      hosts:
        pve-01:
          ansible_host: 10.10.10.2
          proxmox_api_url: "https://10.10.10.2:8006/api2/json"
        pve-02:
          ansible_host: 10.10.10.3
          proxmox_api_url: "https://10.10.10.3:8006/api2/json"

    viavitae:
      hosts:
        prod-cp-0:
          ansible_host: 10.10.20.40
          vmid: 1200
          k3s_role: control_plane
          node: pve-01
        prod-worker-0:
          ansible_host: 10.10.20.50
          vmid: 1210
          k3s_role: worker
          node: pve-01
        prod-worker-1:
          ansible_host: 10.10.20.51
          vmid: 1211
          k3s_role: worker
          node: pve-02
        prod-worker-2:
          ansible_host: 10.10.20.52
          vmid: 1212
          k3s_role: worker
          node: pve-01
        prod-worker-3:
          ansible_host: 10.10.20.53
          vmid: 1213
          k3s_role: worker
          node: pve-02
        db-01:
          ansible_host: 10.10.20.30
          vmid: 930
          pg_purpose: tenants
          pg_role: primary
          node: pve-01
        sso-01:
          ansible_host: 10.10.20.20
          vmid: 920
          node: pve-01
        mon-01:
          ansible_host: 10.10.20.10
          vmid: 910
          node: pve-01
        lb-01:
          ansible_host: 10.10.10.10
          vmid: 900
          dmz_host: 10.10.40.11
          haproxy_vip_priority: 100
          node: pve-01
        lb-02:
          ansible_host: 10.10.10.11
          vmid: 901
          dmz_host: 10.10.40.12
          haproxy_vip_priority: 90
          node: pve-02
        runner-01:
          ansible_host: 10.10.10.15
          vmid: 991
          node: pve-01
        runner-02:
          ansible_host: 10.10.10.16
          vmid: 992
          node: pve-02

      children:
        k3s_control_plane:
          hosts:
            prod-cp-0:
        k3s_worker:
          hosts:
            prod-worker-0:
            prod-worker-1:
            prod-worker-2:
            prod-worker-3:
        k3s_cluster:
          children:
            k3s_control_plane:
            k3s_worker:
        postgres:
          hosts:
            db-01:
        keycloak:
          hosts:
            sso-01:
        monitoring_store:
          hosts:
            mon-01:
        loadbalancer:
          hosts:
            lb-01:
            lb-02:
        ci_runner:
          hosts:
            runner-01:
            runner-02:
        # Empty while ADR-007 conditions 7 and 8 are unmet. Adding a host here without
        # both approvals fails the plan in terraform/modules/bitrix24-vm, and the
        # bitrix24.yml playbook refuses to run against a prod inventory that does not
        # carry them.
        bitrix24:
          hosts: {}
        # The mgmt VLAN. Every host that can reach the Proxmox API or hold a CI
        # credential. Nothing in this group is reachable from prod, staging, dev or dmz
        # (rule X11), which is the invariant that makes a compromised runner survivable.
        mgmt:
          hosts:
            lb-01:
            lb-02:
            runner-01:
            runner-02:
        dmz:
          hosts:
            lb-01:
            lb-02:
        backup_targets:
          children:
            k3s_cluster:
            postgres:
            keycloak:
            monitoring_store:
            loadbalancer:
