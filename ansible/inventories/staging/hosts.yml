# Inventory for the `staging` environment.
#
# Staging is a scaled copy of production, not a copy of production. It is the DR drill
# target, which is why it has a real PostgreSQL host with WAL-G archiving and a real
# Keycloak — rehearsing a restore against an in-cluster database proves nothing about
# the procedure that will be used in production.
#
# This file is hand-maintained and must agree with `terraform/envs/staging` outputs.
# `tools/preflight.sh` compares the two and fails on a mismatch, because an inventory
# that points at a rebuilt VM runs hardening against a machine that no longer exists
# and reports success.
#
# No credential of any kind belongs in this file. Secrets live in
# `group_vars/vault.sops.yml`, SOPS-encrypted with age, per ADR-005.

all:
  vars:
    ansible_user: viavitae
    ansible_ssh_common_args: "-o IdentitiesOnly=yes"
    environment_name: staging
    vlan_id: 30
    subnet: 10.10.30.0/24
    gateway: 10.10.30.1

  children:
    viavitae:
      hosts:
        stg-cp-0:
          ansible_host: 10.10.30.30
          vmid: 1100
          k3s_role: control_plane
          node: pve-01
        stg-worker-0:
          ansible_host: 10.10.30.40
          vmid: 1110
          k3s_role: worker
          node: pve-02
        stg-db-0:
          ansible_host: 10.10.30.10
          vmid: 1120
          pg_purpose: tenants
          pg_role: primary
          node: pve-01
        stg-sso-0:
          ansible_host: 10.10.30.20
          vmid: 1121
          node: pve-01

      children:
        k3s_control_plane:
          hosts:
            stg-cp-0:
        k3s_worker:
          hosts:
            stg-worker-0:
        k3s_cluster:
          children:
            k3s_control_plane:
            k3s_worker:
        postgres:
          hosts:
            stg-db-0:
        keycloak:
          hosts:
            stg-sso-0:
        bitrix24:
          hosts: {}
        monitoring_store:
          hosts: {}
        backup_targets:
          children:
            k3s_cluster:
            postgres:
            keycloak:
