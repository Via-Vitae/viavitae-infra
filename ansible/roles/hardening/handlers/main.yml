---
- name: Restart sshd
  # Restart, not reload: several of the settings above are only read at start. The
  # playbook verifies SSH connectivity afterwards and reports a lockout with the console
  # recovery command, because "restart sshd" is the task most likely to end a remote
  # session permanently.
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  # `systemctl restart auditd` is refused by systemd on Debian; augenrules is the
  # supported path and does not lose the events already in the queue.

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
