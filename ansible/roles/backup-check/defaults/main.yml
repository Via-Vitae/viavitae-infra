---
# Defaults for the backup-check role. Anything here can be overridden per group or per
# host; anything that must not be overridden belongs in a task assertion instead.

# Backup verification levels. Level 1 (the job ran) passes during a real failure; only
# level 3 (a restore actually boots) has ever caught a defect. The role defaults to
# level 2 (checksum verification) because level 3 requires a scratch VM and is slow.
backup_check_level: 2

# Backup retention. A backup that is deleted before the retention period expires is a
# backup that was needed; a backup that is kept forever is a backup that fills the disk.
backup_check_retention_daily: 14
backup_check_retention_weekly: 8

# The drill schedule. Quarterly is the minimum; monthly is recommended for a pilot
# that has not yet established a baseline.
backup_check_drill_schedule: "quarterly"
