---
# Prometheus agent mode. Runs on the hypervisors only; scrapes VLAN 10 hosts and
# remote-writes to the production Prometheus.

- name: Refuse to install the agent without the remote-write URL
  ansible.builtin.assert:
    that:
      - prometheus_remote_write_url is defined
      - prometheus_remote_write_url | length > 0
    fail_msg: >-
      {{ inventory_hostname }} is a hypervisor but has no `prometheus_remote_write_url`
      defined. Set it in group_vars/proxmox.yml. The agent refuses to run without it,
      because an agent that cannot remote-write is an agent that holds no data and
      provides no observability.

- name: Install Prometheus in agent mode
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_agent_version }}/prometheus-{{ prometheus_agent_version }}.linux-amd64.tar.gz"
    dest: "{{ prometheus_agent_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1, "--wildcard", "*/prometheus"]
    owner: root
    group: root
    mode: "0755"
  notify: Verify Prometheus agent installation

- name: Create the Prometheus agent configuration directory
  ansible.builtin.file:
    path: "{{ prometheus_agent_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Prometheus agent mode
  ansible.builtin.template:
    src: prometheus-agent.yml.j2
    dest: "{{ prometheus_agent_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus-agent

- name: Install the Prometheus agent systemd unit
  ansible.builtin.template:
    src: prometheus-agent.service.j2
    dest: /etc/systemd/system/prometheus-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus-agent

- name: Ensure Prometheus agent is started and enabled
  ansible.builtin.systemd:
    name: prometheus-agent
    state: started
    enabled: true
    daemon_reload: true
