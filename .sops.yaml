# SOPS configuration for the entire repository.
#
# This file must be at the repository root, not in k8s/secrets/, because SOPS
# resolves configuration by walking up from the encrypted file's directory. A
# .sops.yaml in k8s/secrets/ cannot govern ansible/inventories/**/*.sops.yml.
#
# Age recipients:
#   - Operator 1: age1a7yvzgpm3p9tzf6aefz8vr0zcdawxtqqx887surkc8l7q3xn39qs4y2nlh
#   - Operator 2: age1a8f0zphcq96denjfdpwevz8kdkvjxf0zwhag22r0pfa06uxq4uwsvjmm39
#   - CI identity: age14lz90j3z7umrws899mcckeefvqcfqh996aml6x07jjfpur6ae3zqe0ar3r
#
# Security policy:
#   - dev/staging: CI identity + both operators (CI can encrypt/decrypt)
#   - prod: both operators ONLY (NO CI key — manual decryption required)
#   - k8s secrets + terraform vars: CI identity + both operators

creation_rules:
  # Dev environment: CI + operators
  - path_regex: ansible/inventories/dev/group_vars/vault\.sops\.yml$
    age: >-
      age14lz90j3z7umrws899mcckeefvqcfqh996aml6x07jjfpur6ae3zqe0ar3r,
      age1a7yvzgpm3p9tzf6aefz8vr0zcdawxtqqx887surkc8l7q3xn39qs4y2nlh,
      age1a8f0zphcq96denjfdpwevz8kdkvjxf0zwhag22r0pfa06uxq4uwsvjmm39

  # Staging environment: CI + operators
  - path_regex: ansible/inventories/staging/group_vars/vault\.sops\.yml$
    age: >-
      age14lz90j3z7umrws899mcckeefvqcfqh996aml6x07jjfpur6ae3zqe0ar3r,
      age1a7yvzgpm3p9tzf6aefz8vr0zcdawxtqqx887surkc8l7q3xn39qs4y2nlh,
      age1a8f0zphcq96denjfdpwevz8kdkvjxf0zwhag22r0pfa06uxq4uwsvjmm39

  # Prod environment: operators ONLY (NO CI key for security)
  - path_regex: ansible/inventories/prod/group_vars/vault\.sops\.yml$
    age: >-
      age1a7yvzgpm3p9tzf6aefz8vr0zcdawxtqqx887surkc8l7q3xn39qs4y2nlh,
      age1a8f0zphcq96denjfdpwevz8kdkvjxf0zwhag22r0pfa06uxq4uwsvjmm39

  # Kubernetes secrets: CI + operators
  - path_regex: k8s/secrets/.*\.sops\.yaml$
    age: >-
      age14lz90j3z7umrws899mcckeefvqcfqh996aml6x07jjfpur6ae3zqe0ar3r,
      age1a7yvzgpm3p9tzf6aefz8vr0zcdawxtqqx887surkc8l7q3xn39qs4y2nlh,
      age1a8f0zphcq96denjfdpwevz8kdkvjxf0zwhag22r0pfa06uxq4uwsvjmm39

  # Terraform vars: CI + operators
  - path_regex: terraform/.*\.sops\.tfvars$
    age: >-
      age14lz90j3z7umrws899mcckeefvqcfqh996aml6x07jjfpur6ae3zqe0ar3r,
      age1a7yvzgpm3p9tzf6aefz8vr0zcdawxtqqx887surkc8l7q3xn39qs4y2nlh,
      age1a8f0zphcq96denjfdpwevz8kdkvjxf0zwhag22r0pfa06uxq4uwsvjmm39
