---
# ClusterIssuer for Let's Encrypt. Uses DNS-01 challenge, which is the only challenge
# that works for a wildcard certificate and the only challenge that does not require
# an inbound HTTP rule (I3 in docs/network-topology.md).

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@viavitae.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          # The DNS provider is configured via environment variables injected by
          # external-secrets. The API token must never be committed.
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
