---
# ClusterSecretStore for external-secrets. Points at the SOPS-encrypted secrets in
# k8s/secrets/sops/. The external-secrets operator decrypts them at runtime and
# injects them as Kubernetes Secrets.
#
# The alternative — committing decrypted Secrets to Git — is prohibited by ADR-005.
# A Secret in Git is a Secret in every clone, in every backup, and in every CI log.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: sops-store
spec:
  provider:
    sops:
      # The age key is injected via environment variable. The private key must
      # never be committed.
      age:
        secretRef:
          name: sops-age-key
          namespace: external-secrets
          key: age-key
